name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: 'sinuous-crow-410507'
  SERVER_URL: 'https://sinuous-crow-410507.ew.r.appspot.com/'
  # Set these as repository variables (Settings > Secrets and variables > Actions > Variables)
  BUCKET: ${{ vars.FRONTEND_BUCKET }}     # e.g. project-myname-com, without gs://
  URL_MAP: ${{ vars.FRONTEND_URL_MAP }}   # optional; enables CDN invalidation of index.html

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://project.myname.com/

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          credentials_json: ${{ secrets.GCLOUD_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # Backend first, so the new client never talks to an old server
      - uses: google-github-actions/deploy-appengine@v2
        with:
          working_directory: prod
          deliverables: app.yaml

      # Frontend, in dependency order: everything index.html references goes up
      # first, index.html last.

      # static/ holds pack.<hash>.js, durak.<hash>.js, style.<hash>.css. A file
      # there never changes under the same name, so it is cached for a year.
      # Nothing is deleted, so tabs still running an older index.html keep
      # finding the files they reference.
      - name: Upload hashed scripts and styles (immutable)
        run: |
          gcloud storage rsync prod/public/static "gs://${BUCKET}/static" \
            --recursive \
            --cache-control="public, max-age=31536000, immutable"

      # Images and sounds are loaded by path from the game code and keep their
      # names, so they get a moderate cache instead. Not deleted either, for
      # the same reason as above.
      - name: Upload assets (1 day cache)
        run: |
          gcloud storage rsync prod/public/assets "gs://${BUCKET}/assets" \
            --recursive \
            --cache-control="public, max-age=86400"

      - name: Upload docs
        run: |
          gcloud storage rsync prod/public/doc "gs://${BUCKET}/doc" \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="no-cache"

      - name: Upload favicon
        run: |
          gcloud storage cp prod/public/favicon.ico "gs://${BUCKET}/favicon.ico" \
            --cache-control="public, max-age=86400"

      # index.html last and never cached without revalidation: it is the only
      # file that decides which build a visitor gets
      - name: Upload index.html
        run: |
          gcloud storage cp prod/public/index.html "gs://${BUCKET}/index.html" \
            --cache-control="no-cache"

      - name: Invalidate CDN cache for index.html
        if: env.URL_MAP != ''
        run: |
          gcloud compute url-maps invalidate-cdn-cache "${URL_MAP}" \
            --path "/index.html" --global --async
          gcloud compute url-maps invalidate-cdn-cache "${URL_MAP}" \
            --path "/" --global --async
